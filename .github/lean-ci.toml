schema = 1
package_dir = "."
expected_failure = []
formal_only = ["QuillenTest.lean", "QuillenTest/Axioms.lean", "examples/downstream/Audit.lean"]

[roles]
production = ["Quillen"]
tests = ["QuillenTest"]
support = ["lint-style"]

[sources]
support = ["Tools/LintScoped.lean", "examples/downstream/Audit.lean"]

[[clients]]
id = "downstream"
path = "examples/downstream"

[clients.roles]
production = ["Consumer"]

[policy]
style = [".github/lean-ci-style.json"]
exceptions = [".github/lean-ci-exceptions.json"]
