name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@6d1613532357f7943b462876f99dd769049329a4
    with:
      package-directory: .
      build-targets: Quillen
