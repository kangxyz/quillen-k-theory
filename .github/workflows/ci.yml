name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  library:
    permissions:
      contents: write
      actions: read
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@1d990dcd149c2f9fd605b4d21b25e1c54cff9789
    with:
      config: .github/lean-ci.toml
      legacy-dependencies-prefix: third-party-v2
      legacy-dependencies-paths: |
        .lake/packages
      legacy-builds-prefixes: |
        project-build-v3
        project-build-v2
      legacy-builds-paths: |
        .lake/build
        examples/downstream/.lake/build
        .lake/packages/Aglib/.lake/build
