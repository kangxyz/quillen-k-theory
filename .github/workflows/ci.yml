name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source organization
        run: |
          python3 scripts/generate_imports.py --check
          python3 scripts/check_library_layout.py
          python3 scripts/check_placeholders.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the pinned Lean toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/elan
        run: |
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: third-party-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch matching third-party proof cache
        run: bash scripts/cache.sh
      - name: Build the complete library and audit the independent client
        run: |
          lean --version
          bash scripts/audit.sh --rehash
