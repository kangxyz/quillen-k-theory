name = "quillen-k-theory"
version = "0.10.0"
description = "A Lean library for Quillen K-theory and related mathematics."
keywords = ["math", "algebraic-k-theory", "category-theory", "topology"]
homepage = "https://github.com/kangxyz/quillen-k-theory"
license = "Apache-2.0"
defaultTargets = ["Quillen"]
testDriver = "QuillenTest"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["--no-build", "Quillen"]
builtinLint = true
enableArtifactCache = true
restoreAllArtifacts = true

[[lean_lib]]
name = "Quillen"
roots = []
globs = ["Quillen"]
# Native mk_all owns this import-only entry, like Mathlib.lean.
leanOptions = {autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 0, warningAsError = true}

[[lean_lib]]
name = "QuillenModules"
roots = []
globs = ["Quillen.+"]
leanOptions = {autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, warningAsError = true}

[[lean_lib]]
name = "QuillenTest"
globs = ["QuillenTest.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "Aglib"
git = "https://github.com/kangxyz/aglib.git"
rev = "2c34f185fa859e862661f939cd216b07bcccfb26"
