name = "quillen-k-theory"
version = "0.4.1"
description = "A Lean library for Quillen K-theory and related mathematics."
keywords = ["math", "algebraic-k-theory", "category-theory", "topology"]
homepage = "https://github.com/kangxyz/quillen-k-theory"
license = "Apache-2.0"
defaultTargets = ["Quillen"]
testDriver = "Tests"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Quillen"]
builtinLint = true

[[lean_lib]]
name = "Quillen"
leanOptions = {autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, warningAsError = true}

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "lint-style"
root = "Tools.LintStyle"
supportInterpreter = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
